name: Günlük veri çekimi ve yayın

on:
  schedule:
    - cron: '17 4 * * *'          # her gün 04:17 UTC
  workflow_dispatch:               # elle "Run workflow" düğmesi
  push:
    branches: [claude/inditex-order-forecast-app-jqduzd, main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apify'dan veri çek
        if: github.event_name != 'push'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}
          APIFY_MAX_USD: ${{ vars.APIFY_MAX_USD || '2' }}
        run: node scripts/sync.mjs

      - name: Veriyi depoya kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Günlük veri güncellemesi" && git push)

      - run: npm run build
      - name: Veriyi siteye ekle
        run: |
          mkdir -p dist/data
          cp data/snapshots.json dist/data/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
